name: Android release

# Builds a release APK with the optional Gemini cloud layer wired from the
# `GEMINI_API_KEY` repository secret. The app stays fully offline-first when the
# secret is unset — the `--dart-define` is simply empty and `AppConfig` parses it
# to an empty key pool.
#
# Configure the secret once under
# Settings → Secrets and variables → Actions → New repository secret.
# Put a comma-separated pool in the same secret to rotate keys without a new
# build (see README > "Optional cloud layer (Gemini)").

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build release APK
    # Pinned, never `ubuntu-latest`. The `ubuntu-latest` label is migrating to
    # Ubuntu 26.04 through November 2026, which changes the default JDK, Docker
    # (28 -> 29) and preinstalled runtime patch versions under a workflow that
    # did not change — a silent, moving target. See
    # https://github.com/actions/runner-images/issues/14748
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          --dart-define=GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: routenote-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
