name: Firebase App Distribution

# Builds a release APK and hands it to the Firebase App Distribution testers
# group. This is the distribution path for real releases (major/minor/patch
# bumps); day-to-day patch builds go out through the local build + ADB flow
# instead.
#
# Build and distribute are separate jobs so the expensive part is cached across
# retries. Distribution problems (a bad secret, a missing IAM role) used to cost
# a full ~10 minute rebuild each time; now the `build` job's APK is uploaded as
# an artifact and `distribute` reuses it, so a re-run with `--only-job`
# (or a re-dispatch once the artifact exists) is seconds, not minutes.
#
# This workflow only distributes — it does not analyze or test. Validation lives
# in `android-release.yml`, which also fires on `v*` tags and runs
# `flutter analyze lib test` + `flutter test` before uploading an artifact.
# Both run on a release tag, each with a distinct purpose.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY              - optional; unset keeps the app fully offline
#   FIREBASE_APP_ID             - Firebase Android app id, e.g. 1:1234:android:abcd
#   FIREBASE_SERVICE_ACCOUNT_KEY - the service account JSON key, verbatim
#
# The service account needs the "Firebase App Distribution Admin" role; on this
# project it is granted `roles/firebase.admin`, which covers it. Note that
# `firebaseappdistro.admin` alone does NOT: it carries `releases.list` and
# `releases.update` but not `releases.create`, so the upload call is refused
# with `403 The caller does not have permission` even though authentication
# succeeds.

on:
  workflow_dispatch:
  push:
    tags:
      # Bare release tag, e.g. v1.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Tag carrying a build number, e.g. v1.0.5+22. The build number needs its
      # own `[0-9]+`; a bare `\+*` would match `v1.0.5` and `v1.0.5+` but never
      # `v1.0.5+22`, which is the case this pattern exists for.
      - 'v[0-9]+.[0-9]+.[0-9]+\+[0-9]+'

jobs:
  build:
    name: Build release APK
    # Pinned, never `ubuntu-latest`. The `ubuntu-latest` label is migrating to
    # Ubuntu 26.04 through November 2026, which changes the default JDK, Docker
    # (28 -> 29) and preinstalled runtime patch versions under a workflow that
    # did not change — a silent, moving target. See
    # https://github.com/actions/runner-images/issues/14748
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # The APK is ~67 MB and only needs to outlive the distribute job that
      # consumes it, so retention is one day rather than the 90-day default.
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  distribute:
    name: Distribute to testers
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Nothing here needs the repository, Java or Flutter — the artifact is the
      # only input besides the two secrets — so this job skips all of that and
      # starts at the download.
      - name: Download release APK
        uses: actions/download-artifact@v6
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk

      # A secret is stored exactly as pasted, and a trailing newline (easy to
      # paste by accident) previously split the argument list below across two
      # shell lines — `--groups` was executed as a command and the firebase CLI
      # got a truncated invocation that reported "Failed to authenticate".
      # Normalize it into a file-backed env var first. The action splits `args`
      # on whitespace itself and does NOT run it through a shell, so no `$(...)`
      # substitution may appear in `args`.
      - name: Normalize Firebase app id
        shell: bash
        run: |
          app_id="$(printf '%s' "$FIREBASE_APP_ID_RAW" | tr -d '[:space:]')"
          if [ -z "$app_id" ]; then
            echo "::error::FIREBASE_APP_ID secret is empty or whitespace-only"
            exit 1
          fi
          echo "FIREBASE_APP_ID=$app_id" >> "$GITHUB_ENV"
        env:
          FIREBASE_APP_ID_RAW: ${{ secrets.FIREBASE_APP_ID }}

      # The action only checks that the secret parses as JSON (`jq empty`), so a
      # google-services.json — also valid JSON — is accepted and then fails
      # later with a bare "Failed to authenticate". Validate the credential's
      # shape here instead, and report why. Prints field NAMES only; never a
      # value, so the key stays secret.
      - name: Validate service account key
        shell: bash
        run: |
          key="$(printf '%s' "$SA_KEY_RAW")"
          echo "length: ${#key} bytes"
          echo "first 1 char: $(printf '%s' "$key" | cut -c1)"

          if ! printf '%s' "$key" | jq -e . >/dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_KEY is not valid JSON."
            exit 1
          fi

          echo "top-level fields: $(printf '%s' "$key" | jq -r 'keys | join(", ")')"

          type="$(printf '%s' "$key" | jq -r '.type // "MISSING"')"
          if [ "$type" != "service_account" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_KEY has type='$type', expected 'service_account'."
            echo "::error::A google-services.json also parses as JSON and will land here."
            echo "::error::Get a key from Cloud Console > IAM & Admin > Service Accounts > Keys > Add key > JSON."
            exit 1
          fi

          printf '%s' "$key" | jq -e '.private_key and .client_email and .project_id' >/dev/null 2>&1 || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT_KEY is missing private_key, client_email or project_id."
            exit 1
          }

          # The PEM must keep its literal \n escapes; if a paste turned them into
          # real newlines the JSON would already have failed above, and if they
          # were stripped the PEM cannot be parsed.
          if ! printf '%s' "$key" | jq -r '.private_key' | grep -q '^-----BEGIN PRIVATE KEY-----'; then
            echo "::error::private_key does not start with '-----BEGIN PRIVATE KEY-----'; the paste likely mangled its line breaks."
            exit 1
          fi

          echo "client_email domain: $(printf '%s' "$key" | jq -r '.client_email | split("@")[1]')"
          echo "project_id matches repo project: $(printf '%s' "$key" | jq -r '.project_id')"
          echo "OK: service account key looks structurally valid."
        env:
          SA_KEY_RAW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Distribute to Firebase App Distribution
        uses: w9jds/firebase-action@v15.34.0
        with:
          # `appdistribution:distribute` takes the APK as a positional argument
          # and the app id via `--app`. Flags verified against firebase-tools.
          args: >-
            appdistribution:distribute
            build/app/outputs/flutter-apk/app-release.apk
            --app ${{ env.FIREBASE_APP_ID }}
            --groups testers
            --release-notes ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
