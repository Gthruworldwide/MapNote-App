name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Only repository collaborators may invoke the agent with write scopes and
    # model secrets. The command must be the whole comment or a leading token;
    # a bare `contains` matched ordinary links containing `/oc`.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/oc' ||
       startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' ||
       startsWith(github.event.comment.body, '/opencode '))
    runs-on: ubuntu-24.04
    # Token mode: the runner's built-in GITHUB_TOKEN does the work, so no
    # OpenCode GitHub App install is needed. `id-token: write` is only required
    # for the App/OIDC flow and is intentionally omitted here.
    permissions:
      contents: write        # create branches / commits
      pull-requests: write   # open PRs and comment on them
      issues: write          # reply on issues
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # Lets the agent run `flutter analyze` / `flutter test` / `flutter build`.
      # Match the app's Flutter version (see README → Tech stack).
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'

      - name: Run OpenCode
        uses: anomalyco/opencode@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          # Provider key for the model below. Add GEMINI_API_KEY under
          # Settings → Secrets and variables → Actions. Never inline a key here.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-2.5-flash
          use_github_token: true
