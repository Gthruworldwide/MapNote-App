name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    # Token mode: the runner's built-in GITHUB_TOKEN does the work, so no
    # OpenCode GitHub App install is needed. `id-token: write` is only required
    # for the App/OIDC flow and is intentionally omitted here.
    permissions:
      contents: write        # create branches / commits
      pull-requests: write   # open PRs and comment on them
      issues: write          # reply on issues
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Lets the agent run `flutter analyze` / `flutter test` / `flutter build`.
      # Match the app's Flutter version (see README → Tech stack).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Provider key for the model below. Add it in
          # Settings → Secrets and variables → Actions.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-sonnet-4-20250514   # set your preferred provider/model
          use_github_token: true
