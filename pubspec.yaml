name: routenote
description: "MapNote - offline-first saved places with Google Drive sync."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4+5

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  path_provider: ^2.1.6
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  http: ^1.6.0
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  workmanager: ^0.10.10
  # 1.9.0 requires AGP 9.2+ / Kotlin 2.4 / Gradle 9.4 / compileSdk 37 + breaking
  # iOS changes (SwiftPM + SceneDelegate). This project is pinned to Gradle
  # 8.14 / AGP 8.11.1 and only SDK 34-36 platforms are installed, so stay on
  # the last same-Dart-API 1.8.x release.
  receive_sharing_intent: 1.8.1
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  quick_actions: ^1.1.0
  # Modern replacement for the removed `flutter_dynamic_icon` (whose legacy
  # Android plugin broke the Gradle build). Drives the light/dark launcher-icon
  # switch in lib/src/services/dynamic_icon_service.dart.
  flutter_dynamic_icon_plus: ^1.2.1
  # Draws the MapNote lockup (assets/brand/route_note_*.svg) as real vector, so
  # the cold-start splash can scale the mark up without any raster softness, and
  # the same assets serve iOS and Android. See lib/src/core/brand/.
  flutter_svg: ^2.3.0

  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  # Pure-Dart Open Location Code (Plus Code) encode/decode, computed entirely
  # on-device so capturing or pasting a location never needs a network call.
  # Wrapped by lib/src/core/utils/plus_code.dart.
  open_location_code: ^1.0.1
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end integration tests (flutter test integration_test/app_test.dart).
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generate the localizations from the ARB files in lib/l10n.
  generate: true

  # Bundled assets. The animated launcher-icon source is consumed at build time
  # by flutter_launcher_icons and does not need to be listed here.
  #
  # assets/brand/ holds the transparent MapNote lockup, split into its two
  # vector parts (assets/brand/route_note_mark.svg and route_note_wordmark.svg)
  # because the cold-start splash animates them independently. Subdirectories
  # (assets/brand/src/) are not bundled, so the Figma sources stay out of the
  # app.
  assets:
    - assets/app_icon_animated.gif
    - assets/brand/

  # Manrope is bundled locally (assets/fonts/) instead of being downloaded at
  # runtime, so MapNote's type is available instantly and fully offline from the
  # very first launch. Weights mirror the design system: 400 body, 600 buttons
  # and subtitles, 700 headlines.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  # Full "White" master (white backdrop + pin glyph) -> legacy Android + iOS.
  image_path: "assets/icon/ic_launcher_master_light.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Adaptive / themed launcher icon (Android 8+). The foreground is the pin
  # glyph centered in the adaptive safe zone; the white backdrop color plus the
  # monochrome layer give Android 13+ Material You themed icons. The dark
  # alt-icon (ic_launcher_dark, AMOLED-black backdrop) used by the dynamic
  # light/dark switch is rendered by tool/gen_dark_icon.ps1.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icon/ic_launcher_monochrome.png"
