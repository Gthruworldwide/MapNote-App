org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.java.home=C\:/Users/nader/.jdks/temurin-17
android.useAndroidX=true
# AGP 9's new DSL is not enabled yet; the Flutter tool adds this opt-out for
# projects that still use the legacy AGP DSL types.
android.newDsl=false
# Built-in Kotlin (AGP 9+) is intentionally left disabled. AGP 9 can compile
# Kotlin itself, but two dependencies have not migrated yet and fail to
# configure under it, so this project stays on the legacy Kotlin Gradle Plugin
# (KGP) path that Flutter keeps working while plugins migrate:
#   - flutter_dynamic_icon_plus 1.4.1 applies `kotlin-android` unconditionally
#     (no migrated release exists; latest is 1.4.1).
#   - receive_sharing_intent 1.8.1 applies `kotlin-android` unconditionally;
#     1.9.0 migrates but requires AGP 9.2+ / Gradle 9.4 / compileSdk 37 plus
#     SwiftPM + SceneDelegate iOS changes.
# Set this to `true` once every plugin below has a built-in-Kotlin release.
# See README > "Android / Kotlin build notes" and
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
# Some Flutter plugins (e.g. receive_sharing_intent) do not pin a Kotlin
# jvmTarget, which defaults to the Gradle JDK while Flutter compiles their Java
# to 11. Downgrade that mismatch from an error to a warning.
kotlin.jvm.target.validation.mode=warning

# Kotlin 2.4's compile daemon can fail to connect under this Gradle 9.1 / JDK 17
# setup ("Failed connecting to the daemon in 4 retries"), which surfaces as
# "Could not close incremental caches" for every plugin subproject. Compiling in
# the Gradle process and turning off the incremental cache sidesteps both.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
