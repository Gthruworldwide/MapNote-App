org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# The Gradle JDK is deliberately NOT pinned here. `org.gradle.java.home` is an
# absolute, machine-specific path: committing one (as this file used to) breaks
# every other environment with
#   "Value '<path>' given for org.gradle.java.home Gradle property is invalid"
# — a CI runner, a teammate, or a fresh clone. Supply it per machine instead:
#   * `flutter config --jdk-dir <path>`, or
#   * `org.gradle.java.home=<path>` in the user-level
#     `~/.gradle/gradle.properties` (never in this file), or
#   * the `JAVA_HOME` environment variable.
# The toolchain requires JDK 17+.
# AGP 9's new DSL is not enabled yet; the Flutter tool adds this opt-out for
# projects that still use the legacy AGP DSL types.
android.newDsl=false
# Built-in Kotlin (AGP 9+) is enabled. AGP compiles the app's and plugins' Kotlin
# itself, so no module applies the legacy Kotlin Gradle Plugin (KGP) by default.
# This is the migration target for future Flutter releases, which will remove the
# legacy KGP path. Plugins that still apply KGP unconditionally are handled:
#   - firebase_core / firebase_analytics / firebase_crashlytics and
#     workmanager_android already apply KGP only when this flag is `false`.
#   - receive_sharing_intent >= 1.9.0 no longer applies KGP (upgraded from 1.8.1).
#   - flutter_dynamic_icon_plus is vendored under third_party/ with a patched
#     Gradle script that applies KGP only when this flag is `false` (upstream
#     applies it unconditionally in every release).
# See README > "Android / Kotlin build notes" and
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=true
# Some Flutter plugins (e.g. receive_sharing_intent) do not pin a Kotlin
# jvmTarget, which defaults to the Gradle JDK while Flutter compiles their Java
# to 11. Downgrade that mismatch from an error to a warning.
kotlin.jvm.target.validation.mode=warning

# Kotlin 2.4's compile daemon can fail to connect under this Gradle 9.4.1 / JDK 17
# setup ("Failed connecting to the daemon in 4 retries"), which surfaces as
# "Could not close incremental caches" for every plugin subproject. Compiling in
# the Gradle process and turning off the incremental cache sidesteps both.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
