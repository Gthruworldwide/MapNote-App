sonar.projectKey=Gthruworldwide_MapNote-App
sonar.organization=gthruworldwide

# Project Identity
sonar.projectName=MapNote-App
sonar.projectVersion=1.0

# Source & Test Directories
sonar.sources=lib
sonar.tests=test

# File Encoding
sonar.sourceEncoding=UTF-8

# Exclude generated code and assets from analysis
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,build/**,android/**,ios/**,web/**

# Coverage report location for Dart/Flutter tests
sonar.dart.lcov.reportPaths=coverage/lcov.info
